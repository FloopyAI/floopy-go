name: Release

# release-please opens/updates a release PR with the next version computed
# from Conventional Commits since the last tag. When that PR is merged the
# action creates the Git tag + GitHub Release.
#
# Go has no package registry: a module is "published" the instant an
# immutable, semver Git tag exists and the Go module proxy has fetched it.
# Authenticity is guaranteed by the Go checksum database (sum.golang.org) —
# there is NO registry account or long-lived token in this repo. The publish
# job below just warms proxy.golang.org so `go get` and pkg.go.dev see the
# new version immediately after the tag is cut.

on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release-please:
    name: release-please
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    name: verify + index module
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: pkg.go.dev
      url: https://pkg.go.dev/github.com/FloopyAI/floopy-go
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true

      - name: Verify modules are tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Test
        run: go test -race ./...

      - name: Build
        run: go build ./...

      - name: Warm the Go module proxy + pkg.go.dev
        env:
          TAG: ${{ needs.release-please.outputs.tag_name }}
          GOPROXY: https://proxy.golang.org
        run: |
          MODULE=github.com/FloopyAI/floopy-go
          echo "Requesting $MODULE@$TAG via the public proxy…"
          for i in 1 2 3 4 5; do
            if GOFLAGS=-mod=mod go list -m "$MODULE@$TAG"; then
              echo "Indexed."
              exit 0
            fi
            echo "Not yet visible, retrying in 15s ($i/5)…"
            sleep 15
          done
          # The tag exists and is authoritative even if the proxy is slow;
          # don't fail the release on proxy propagation lag.
          echo "::warning::proxy did not surface $MODULE@$TAG yet; it will index on first fetch."
